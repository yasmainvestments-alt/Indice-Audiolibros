<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YasmaStark Audiobook Library</title>
    <!-- Favicon para la pestaña del navegador -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='128' fill='%2307070a'/><path d='M256 96c-79.5 0-144 64.5-144 144v112c0 26.5 21.5 48 48 48h16c17.7 0 32-14.3 32-32V288c0-17.7-14.3-32-32-32h-32v-16c0-61.9 50.1-112 112-112s112 50.1 112 112v16h-32c-17.7 0-32 14.3-32 32v80c0 17.7 14.3 32 32 32h16c26.5 0 48-21.5 48-48V240c0-79.5-64.5-144-144-144z' fill='%23ff0055'/></svg>">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        neonRed: '#ff0055',
                        neonRedGlow: 'rgba(255, 0, 85, 0.4)',
                        darkBg: '#07070a',
                        darkCard: '#0f0f15',
                        darkGlass: 'rgba(15, 15, 23, 0.75)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #07070a;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .ios-glass {
            background: rgba(18, 18, 28, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ios-glass-card {
            background: rgba(22, 22, 35, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ios-glass-card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: var(--genre-neon);
            box-shadow: 0 10px 30px -10px var(--genre-glow);
        }

        .ios-btn {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, opacity 0.2s ease;
        }
        .ios-btn:active {
            transform: scale(0.93) !important;
        }

        .neon-badge {
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--genre-neon);
            color: var(--genre-neon);
            box-shadow: inset 0 0 8px var(--genre-glow), 0 0 8px var(--genre-glow);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #07070a;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 0, 85, 0.3);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff0055;
            box-shadow: 0 0 10px #ff0055;
        }

        .glow-pulse-red {
            animation: redPulse 2.5s infinite alternate ease-in-out;
        }
        @keyframes redPulse {
            0% { filter: drop-shadow(0 0 4px rgba(255, 0, 85, 0.5)); }
            100% { filter: drop-shadow(0 0 18px rgba(255, 0, 85, 0.95)); }
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .modal-enter {
            animation: modalIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .view-transition {
            animation: viewIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes viewIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dragging {
            opacity: 0.4 !important;
            transform: scale(0.98);
            border: 2px dashed var(--genre-neon, #ff0055) !important;
        }
        .drag-over {
            border-top: 3px solid var(--genre-neon, #ff0055) !important;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col relative pb-20 selection:bg-neonRed selection:text-white">

    <canvas id="bgCanvas"></canvas>

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 ios-glass border-b border-slate-800/80 px-4 lg:px-8 py-3 transition-all duration-300">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('genres')">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-rose-900 to-neonRed flex items-center justify-center text-white shadow-[0_0_20px_rgba(255,0,85,0.6)] glow-pulse-red">
                    <i class="fa-solid fa-headphones-simple text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-white via-slate-200 to-rose-500 bg-clip-text text-transparent">
                        YasmaStark <span class="text-neonRed font-black">Audiobook Library</span>
                    </h1>
                    <p class="text-[10px] text-slate-400 font-mono tracking-widest uppercase">Biblioteca Privada de Audiolibros</p>
                </div>
            </div>

            <!-- Buscador Global -->
            <div class="relative w-full md:w-96 group">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-neonRed transition-colors"></i>
                <input type="text" id="searchInput" placeholder="Buscar autor (ej: Robin Sharma), año o título..." 
                    class="w-full pl-11 pr-10 py-2.5 rounded-full bg-slate-900/80 border border-slate-700/60 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-neonRed focus:ring-1 focus:ring-neonRed transition-all duration-300">
                <button id="clearSearchBtn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>

            <div class="flex items-center gap-2">
                <!-- Botón Nuevo Género: Muestra solo el icono -->
                <button onclick="openGenreModal()" title="Nuevo Género" class="ios-btn p-2.5 rounded-xl bg-neonRed/10 border border-neonRed text-neonRed hover:bg-neonRed hover:text-white shadow-[0_0_15px_rgba(255,0,85,0.3)] flex items-center justify-center">
                    <i class="fa-solid fa-folder-plus text-base"></i>
                </button>
                <!-- Botón de Guardar y Respaldo mostrando únicamente el Icono -->
                <button onclick="saveAllChangesAndExport()" title="Guardar cambios y descargar salva.json" class="ios-btn p-2.5 rounded-xl bg-emerald-500/10 border border-emerald-500 text-emerald-400 hover:bg-emerald-500 hover:text-white shadow-[0_0_15px_rgba(16,185,129,0.3)] flex items-center justify-center">
                    <i class="fa-solid fa-floppy-disk text-base"></i>
                </button>
                <!-- Botón Descargar Copia de Respaldo de Google Drive -->
                <a href="https://drive.google.com/drive/folders/1xlyq8siWMYgW-aKoC8JNoMaQNmcgyw6l?usp=sharing" target="_blank" rel="noopener noreferrer" title="Descargar Respaldo desde Google Drive" class="ios-btn p-2.5 rounded-xl bg-cyan-500/10 border border-cyan-500 text-cyan-400 hover:bg-cyan-500 hover:text-white shadow-[0_0_15px_rgba(6,182,212,0.3)] flex items-center justify-center">
                    <i class="fa-solid fa-cloud-arrow-down text-base"></i>
                </a>
                <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
                <button onclick="handleImportClick()" title="Importar Respaldo JSON" class="ios-btn p-2.5 rounded-xl bg-slate-800/70 hover:bg-slate-700 border border-slate-700 text-slate-300">
                    <i class="fa-solid fa-upload text-sm"></i>
                </button>
                <button onclick="resetToDefaults()" title="Restablecer Datos por Defecto" class="ios-btn p-2.5 rounded-xl bg-slate-800/70 hover:bg-rose-950/40 border border-slate-700 hover:border-rose-700 text-slate-300 hover:text-rose-400">
                    <i class="fa-solid fa-rotate-right text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full px-4 lg:px-8 pt-6 flex-grow">
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <div onclick="navigateTo('genres')" class="ios-glass p-4 rounded-2xl flex items-center justify-between border-l-4 border-neonRed cursor-pointer hover:bg-slate-800/40 transition-colors">
                <div>
                    <span class="text-xs uppercase text-slate-400 font-medium">Géneros</span>
                    <h3 id="statGenresCount" class="text-2xl font-bold font-mono text-white">0</h3>
                </div>
                <i class="fa-solid fa-layer-group text-slate-600 text-2xl"></i>
            </div>
            <div onclick="navigateTo('genres')" class="ios-glass p-4 rounded-2xl flex items-center justify-between border-l-4 border-cyan-400 cursor-pointer hover:bg-slate-800/40 transition-colors">
                <div>
                    <span class="text-xs uppercase text-slate-400 font-medium">Autores</span>
                    <h3 id="statAuthorsCount" class="text-2xl font-bold font-mono text-white">0</h3>
                </div>
                <i class="fa-solid fa-user-pen text-slate-600 text-2xl"></i>
            </div>
            <div onclick="navigateTo('genres')" class="ios-glass p-4 rounded-2xl flex items-center justify-between border-l-4 border-emerald-400 cursor-pointer hover:bg-slate-800/40 transition-colors">
                <div>
                    <span class="text-xs uppercase text-slate-400 font-medium">Audiolibros</span>
                    <h3 id="statBooksCount" class="text-2xl font-bold font-mono text-white">0</h3>
                </div>
                <i class="fa-solid fa-book-bookmark text-slate-600 text-2xl"></i>
            </div>
            <!-- Estadísticas Favoritos Interactivas -->
            <div onclick="navigateTo('favorites')" class="ios-glass p-4 rounded-2xl flex items-center justify-between border-l-4 border-amber-400 cursor-pointer hover:bg-amber-500/10 border border-amber-500/30 transition-all glow-pulse">
                <div>
                    <span class="text-xs uppercase text-amber-400 font-bold tracking-wider">Favoritos</span>
                    <h3 id="statFavsCount" class="text-2xl font-bold font-mono text-amber-300">0</h3>
                </div>
                <i class="fa-solid fa-heart text-amber-400 text-2xl"></i>
            </div>
        </div>

        <div id="navigationBar" class="flex flex-col sm:flex-row items-center justify-between bg-slate-900/60 border border-slate-800 rounded-2xl p-3 mb-6 gap-3">
            <div class="flex items-center gap-2 text-sm flex-wrap" id="breadcrumbs"></div>
            <div class="flex items-center gap-3" id="viewActions"></div>
        </div>

        <div id="mainViewContainer" class="view-transition"></div>

        <div id="emptyState" class="hidden text-center py-20 ios-glass rounded-3xl border border-dashed border-slate-800">
            <i class="fa-solid fa-book-open-reader text-6xl text-slate-700 mb-4 animate-bounce"></i>
            <h3 class="text-xl font-bold text-slate-300">No se encontraron resultados</h3>
            <p class="text-slate-500 text-sm mt-1">Prueba con otra búsqueda o agrega un nuevo ítem a tu catálogo.</p>
        </div>
    </main>

    <!-- Modales -->

    <!-- Modal 1: Género -->
    <div id="genreModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="ios-glass border border-slate-700 rounded-3xl p-6 w-full max-w-md modal-enter relative">
            <div class="flex justify-between items-center mb-5">
                <h3 id="genreModalTitle" class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-folder-plus text-neonRed"></i> Nuevo Género
                </h3>
                <button onclick="closeModal('genreModal')" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="genreForm" onsubmit="handleGenreSubmit(event)">
                <input type="hidden" id="genreEditId">
                <div class="mb-4">
                    <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Nombre del Género (name)</label>
                    <input type="text" id="genreNameInput" required placeholder="Ej: Desarrollo Personal" 
                        class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-neonRed">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-mono uppercase text-slate-400 mb-2">Color Neón Distintivo</label>
                    <div class="grid grid-cols-4 sm:grid-cols-8 gap-2.5 max-h-40 overflow-y-auto p-1" id="colorPickerContainer"></div>
                    <input type="hidden" id="genreColorInput" value="#00f3ff">
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeModal('genreModal')" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white">Cancelar</button>
                    <button type="submit" class="ios-btn px-6 py-2.5 rounded-xl text-xs font-bold bg-neonRed text-white shadow-[0_0_15px_rgba(255,0,85,0.4)]">Guardar Género</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 2: Autor (Sin casilla de Año) -->
    <div id="authorModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="ios-glass border border-slate-700 rounded-3xl p-6 w-full max-w-md modal-enter relative">
            <div class="flex justify-between items-center mb-5">
                <h3 id="authorModalTitle" class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-neonRed"></i> Nuevo Autor
                </h3>
                <button onclick="closeModal('authorModal')" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="authorForm" onsubmit="handleAuthorSubmit(event)">
                <input type="hidden" id="authorGenreId">
                <input type="hidden" id="authorEditId">
                <div class="mb-4">
                    <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Nombre del Autor (name)</label>
                    <input type="text" id="authorNameInput" required placeholder="Ej: Robin Sharma" 
                        class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-neonRed">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-mono uppercase text-slate-400 mb-1">URL Avatar/Foto (Opcional)</label>
                    <input type="url" id="authorPhotoInput" placeholder="https://..." 
                        class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-neonRed">
                </div>
                <div class="mb-5">
                    <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Biografía Breve</label>
                    <textarea id="authorBioInput" rows="3" placeholder="Resumen sobre el autor..." 
                        class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-neonRed resize-none"></textarea>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeModal('authorModal')" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white">Cancelar</button>
                    <button type="submit" class="ios-btn px-6 py-2.5 rounded-xl text-xs font-bold bg-neonRed text-white shadow-[0_0_15px_rgba(255,0,85,0.4)]">Guardar Autor</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 2B: Nueva/Editar Carpeta (Saga) dentro de Autor -->
    <div id="folderModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="ios-glass border border-slate-700 rounded-3xl p-6 w-full max-w-md modal-enter relative">
            <div class="flex justify-between items-center mb-5">
                <h3 id="folderModalTitle" class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-folder-plus text-neonRed"></i> Nueva Carpeta / Saga
                </h3>
                <button onclick="closeModal('folderModal')" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="folderForm" onsubmit="handleFolderSubmit(event)">
                <input type="hidden" id="folderGenreId">
                <input type="hidden" id="folderAuthorId">
                <input type="hidden" id="folderEditId">
                <div class="mb-4">
                    <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Nombre de la Carpeta / Saga</label>
                    <input type="text" id="folderNameInput" required placeholder="Ej: Saga Harry Potter, Trilogía del Fuego..." 
                        class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-neonRed">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-mono uppercase text-slate-400 mb-2">Color Distintivo de la Carpeta</label>
                    <div class="grid grid-cols-4 sm:grid-cols-8 gap-2.5 max-h-40 overflow-y-auto p-1" id="folderColorPickerContainer"></div>
                    <input type="hidden" id="folderColorInput" value="#00ff88">
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeModal('folderModal')" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white">Cancelar</button>
                    <button type="submit" class="ios-btn px-6 py-2.5 rounded-xl text-xs font-bold bg-neonRed text-white shadow-[0_0_15px_rgba(255,0,85,0.4)]">Guardar Carpeta</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 3: Audiolibro (Sin barra de porcentaje, con Tiempo escrito a mano y selección de Carpeta) -->
    <div id="bookModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="ios-glass border border-slate-700 rounded-3xl p-6 w-full max-w-lg modal-enter relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-5">
                <h3 id="bookModalTitle" class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-book-medical text-neonRed"></i> Nuevo Audiolibro
                </h3>
                <button onclick="closeModal('bookModal')" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="bookForm" onsubmit="handleBookSubmit(event)">
                <input type="hidden" id="bookGenreId">
                <input type="hidden" id="bookAuthorId">
                <input type="hidden" id="bookEditId">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Título del Libro (title)</label>
                        <input type="text" id="bookTitleInput" required placeholder="Ej: El Club de las 5 de la mañana" 
                            class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-neonRed">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Ubicación / Carpeta de Saga</label>
                        <select id="bookFolderInput" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-neonRed">
                            <option value="">Raíz del Autor (Sin carpeta)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Año de Publicación (year)</label>
                        <input type="number" id="bookYearInput" placeholder="Ej: 2018" min="1000" max="2099" 
                            class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-neonRed">
                    </div>
                    <div>
                        <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Duración (Horas:Minutos)</label>
                        <input type="text" id="bookDurationInput" placeholder="Ej: 11h 00m" 
                            class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-neonRed">
                    </div>
                    
                    <div class="md:col-span-2 bg-slate-900/90 p-3 rounded-xl border border-slate-800">
                        <label class="block text-xs font-mono uppercase text-slate-400 mb-2">Formatos Disponibles</label>
                        <div class="flex items-center gap-6">
                            <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-slate-200">
                                <input type="checkbox" id="bookFisicoInput" class="w-4 h-4 rounded accent-neonRed">
                                <i class="fa-solid fa-book text-amber-400"></i> Físico
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-slate-200">
                                <input type="checkbox" id="bookAudioInput" class="w-4 h-4 rounded accent-neonRed" checked>
                                <i class="fa-solid fa-headphones text-cyan-400"></i> Audiolibro
                            </label>
                        </div>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Enlace del Audiolibro (URL Reproductor / Enlace)</label>
                        <input type="url" id="bookAudioUrlInput" placeholder="https://..." 
                            class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-neonRed">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Enlace Externo / Descarga (URL Descarga)</label>
                        <input type="url" id="bookDownloadUrlInput" placeholder="https://..." 
                            class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-neonRed">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Estado de Lectura</label>
                        <select id="bookStatusInput" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-neonRed">
                            <option value="Pendiente">Pendiente</option>
                            <option value="En Proceso">En Proceso</option>
                            <option value="Escuchado">Escuchado</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-mono uppercase text-slate-400 mb-1">URL Portada / Carátula (Opcional)</label>
                        <input type="url" id="bookCoverInput" placeholder="https://..." 
                            class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-neonRed">
                    </div>
                    <!-- Entrada de Tiempo Escrito (Reemplaza a la barra de porcentaje) -->
                    <div class="md:col-span-2">
                        <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Tiempo Escuchado / Posición</label>
                        <input type="text" id="bookTimeListenedInput" placeholder="Ej: 02:45:10, Cap. 5..." 
                            class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-neonRed font-mono">
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal('bookModal')" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white">Cancelar</button>
                    <button type="submit" class="ios-btn px-6 py-2.5 rounded-xl text-xs font-bold bg-neonRed text-white shadow-[0_0_15px_rgba(255,0,85,0.4)]">Guardar Libro</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 4: Perfil Detallado Autor -->
    <div id="authorDetailModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="ios-glass border border-slate-700 rounded-3xl p-6 w-full max-w-xl modal-enter relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal('authorDetailModal')" class="absolute right-4 top-4 text-slate-400 hover:text-white z-10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div id="authorDetailContent"></div>
        </div>
    </div>

    <script>
        const DEFAULT_LIBRARY_DATA = [
            {
                id: 'genre-1',
                name: 'Desarrollo Personal',
                color: '#ffb700',
                authors: [
                    {
                        id: 'auth-101',
                        name: 'Robin Sharma',
                        photo: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=300&q=80',
                        bio: 'Experto mundial en liderazgo, autor de El Club de las 5 de la mañana y El monje que vendió su Ferrari.',
                        folders: [],
                        books: [
                            { id: 'b-101', folderId: null, title: 'El Club de las 5 de la mañana', year: '2018', duration: '11h 00m', timeListened: '11h 00m', status: 'Escuchado', favorite: true, cover: 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=600&q=80', isFisico: true, isAudio: true, audioUrl: '', downloadUrl: '' }
                        ]
                    }
                ]
            }
        ];

        const NEON_PALETTE = [
            '#00f3ff', '#00ff88', '#bf00ff', '#ffb700', '#ff0055', '#ff5500', '#ff00aa', '#a8ff00',
            '#00ffd5', '#7928ca', '#ff0033', '#0070f3', '#ff9900', '#39ff14', '#f300ff', '#00e5ff'
        ];

        let libraryData = [];
        let currentNavigation = { view: 'genres', genreId: null, authorId: null, folderId: null };
        let searchQuery = '';
        let authorsSort = 'name-asc';
        let booksSort = 'year-desc';

        // Modos de vista ('list' o 'grid') para Autores y Libros
        let displayMode = {
            authors: 'grid',
            books: 'grid'
        };

        // Helper para eliminar acentos en búsquedas
        function cleanString(str) {
            return (str || '').toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
        }

        window.onload = function() {
            loadLibraryData();
            setupColorPicker();
            setupFolderColorPicker();
            setupEventListeners();
            initBackgroundCanvas();
            renderApp();
        };

        function loadLibraryData() {
            const saved = localStorage.getItem('neon_audiobooks_db');
            if (saved) {
                try { libraryData = JSON.parse(saved); } 
                catch(e) { libraryData = DEFAULT_LIBRARY_DATA; }
            } else {
                libraryData = DEFAULT_LIBRARY_DATA;
                saveLibraryData();
            }
        }

        function saveLibraryData() {
            localStorage.setItem('neon_audiobooks_db', JSON.stringify(libraryData));
            updateStats();
        }

        function saveAllChangesAndExport() {
            saveLibraryData();
            exportData();
            
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 right-6 z-50 bg-emerald-950/90 border border-emerald-500 text-emerald-300 px-5 py-3 rounded-2xl shadow-[0_0_20px_rgba(16,185,129,0.4)] backdrop-blur-md flex items-center gap-3 font-semibold text-sm modal-enter';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-lg text-emerald-400"></i> Guardado y Respaldo generado con éxito.`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 2500);
        }

        function resetToDefaults() {
            if(confirm('¿Restablecer la biblioteca a sus datos por defecto?')) {
                libraryData = JSON.parse(JSON.stringify(DEFAULT_LIBRARY_DATA));
                saveLibraryData();
                navigateTo('genres');
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(libraryData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `salva.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        async function handleImportClick() {
            const googleDriveUrl = 'https://drive.google.com/drive/folders/1xlyq8siWMYgW-aKoC8JNoMaQNmcgyw6l?usp=sharing';
            try {
                const response = await fetch(googleDriveUrl);
                if (response.ok) {
                    const imported = await response.json();
                    if (Array.isArray(imported)) {
                        libraryData = imported;
                        saveLibraryData();
                        navigateTo('genres');
                        alert('¡Salva.json descargada e importada desde Google Drive con éxito!');
                        return;
                    }
                }
            } catch (err) {
                console.log('Error al obtener desde Google Drive directamente, abriendo selector local...', err);
            }
            document.getElementById('importFileInput').click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        libraryData = imported;
                        saveLibraryData();
                        navigateTo('genres');
                        alert('¡Salva.json importada con éxito!');
                    } else { alert('El archivo JSON debe contener una lista válida de géneros.'); }
                } catch (err) { alert('Error al leer el archivo JSON.'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function setupColorPicker() {
            const container = document.getElementById('colorPickerContainer');
            container.innerHTML = NEON_PALETTE.map((color, index) => `
                <button type="button" onclick="selectColor('${color}', this)" 
                    class="w-7 h-7 rounded-full border border-white/20 transition-all duration-200 hover:scale-125 flex items-center justify-center color-swatch ${index === 0 ? 'ring-2 ring-white scale-110' : ''}" 
                    style="background-color: ${color}; box-shadow: 0 0 10px ${color}80;">
                </button>
            `).join('');
            document.getElementById('genreColorInput').value = NEON_PALETTE[0];
        }

        function setupFolderColorPicker() {
            const container = document.getElementById('folderColorPickerContainer');
            container.innerHTML = NEON_PALETTE.map((color, index) => `
                <button type="button" onclick="selectFolderColor('${color}', this)" 
                    class="w-7 h-7 rounded-full border border-white/20 transition-all duration-200 hover:scale-125 flex items-center justify-center folder-color-swatch ${index === 1 ? 'ring-2 ring-white scale-110' : ''}" 
                    style="background-color: ${color}; box-shadow: 0 0 10px ${color}80;">
                </button>
            `).join('');
            document.getElementById('folderColorInput').value = NEON_PALETTE[1];
        }

        function selectColor(color, btnEl) {
            document.getElementById('genreColorInput').value = color;
            document.querySelectorAll('#colorPickerContainer .color-swatch').forEach(el => {
                el.classList.remove('ring-2', 'ring-white', 'scale-110');
            });
            btnEl.classList.add('ring-2', 'ring-white', 'scale-110');
        }

        function selectFolderColor(color, btnEl) {
            document.getElementById('folderColorInput').value = color;
            document.querySelectorAll('#folderColorPickerContainer .folder-color-swatch').forEach(el => {
                el.classList.remove('ring-2', 'ring-white', 'scale-110');
            });
            btnEl.classList.add('ring-2', 'ring-white', 'scale-110');
        }

        function setupEventListeners() {
            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearSearchBtn');

            searchInput.addEventListener('input', (e) => {
                searchQuery = cleanString(e.target.value);
                if (searchQuery.length > 0) {
                    clearBtn.classList.remove('hidden');
                    if (currentNavigation.view !== 'search') {
                        currentNavigation.view = 'search';
                    }
                } else {
                    clearBtn.classList.add('hidden');
                    if (currentNavigation.view === 'search') {
                        currentNavigation.view = 'genres';
                    }
                }
                renderApp();
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                clearBtn.classList.add('hidden');
                currentNavigation.view = 'genres';
                renderApp();
            });
        }

        function toggleDisplayMode(view) {
            displayMode[view] = displayMode[view] === 'list' ? 'grid' : 'list';
            renderApp();
        }

        function navigateTo(view, genreId = null, authorId = null, folderId = null) {
            currentNavigation.view = view;
            if (genreId !== null) currentNavigation.genreId = genreId;
            if (authorId !== null) currentNavigation.authorId = authorId;
            currentNavigation.folderId = folderId;

            if (view !== 'search') {
                document.getElementById('searchInput').value = '';
                document.getElementById('clearSearchBtn').classList.add('hidden');
                searchQuery = '';
            }

            renderApp();
        }

        function handleSortAuthors(sortValue) {
            authorsSort = sortValue;
            const genre = libraryData.find(g => g.id === currentNavigation.genreId);
            if (genre) {
                const arr = genre.authors || genre.autores || [];
                arr.sort((a, b) => {
                    const nameA = a.name || a.nombre || '';
                    const nameB = b.name || b.nombre || '';
                    if (authorsSort === 'name-asc') return nameA.localeCompare(nameB);
                    if (authorsSort === 'name-desc') return nameB.localeCompare(nameA);
                });
                saveLibraryData();
            }
            renderApp();
        }

        function handleSortBooks(sortValue) {
            booksSort = sortValue;
            const genre = libraryData.find(g => g.id === currentNavigation.genreId);
            const author = genre ? (genre.authors || genre.autores || []).find(a => a.id === currentNavigation.authorId) : null;
            if (author) {
                const arr = author.books || author.libros || [];
                arr.sort((a, b) => {
                    const titleA = a.title || a.titulo || '';
                    const titleB = b.title || b.titulo || '';
                    const yearA = parseInt(a.year || a.año) || 0;
                    const yearB = parseInt(b.year || b.año) || 0;

                    if (booksSort === 'title-asc') return titleA.localeCompare(titleB);
                    if (booksSort === 'title-desc') return titleB.localeCompare(titleA);
                    if (booksSort === 'year-asc') return yearA - yearB;
                    if (booksSort === 'year-desc') return yearB - yearA;
                });
                saveLibraryData();
            }
            renderApp();
        }

        function renderApp() {
            updateStats();
            renderBreadcrumbs();

            const container = document.getElementById('mainViewContainer');
            const emptyState = document.getElementById('emptyState');
            container.innerHTML = '';
            emptyState.classList.add('hidden');

            if (currentNavigation.view === 'search' && searchQuery.length > 0) {
                renderSearchResults(container, emptyState);
            } else if (currentNavigation.view === 'genres') {
                renderGenresView(container, emptyState);
            } else if (currentNavigation.view === 'authors') {
                renderAuthorsView(container, emptyState);
            } else if (currentNavigation.view === 'books') {
                renderBooksView(container, emptyState);
            } else if (currentNavigation.view === 'favorites') {
                renderFavoritesView(container, emptyState);
            }
        }

        function renderBreadcrumbs() {
            const bc = document.getElementById('breadcrumbs');
            const actions = document.getElementById('viewActions');

            let bcHtml = `
                <button onclick="navigateTo('genres')" class="flex items-center gap-1.5 text-slate-400 hover:text-white font-medium">
                    <i class="fa-solid fa-layer-group text-neonRed text-xs"></i>
                    <span>Géneros</span>
                </button>
            `;

            if (currentNavigation.view === 'authors' && currentNavigation.genreId) {
                const genre = libraryData.find(g => g.id === currentNavigation.genreId);
                if (genre) {
                    bcHtml += `
                        <i class="fa-solid fa-chevron-right text-xs text-slate-600"></i>
                        <span class="font-bold text-white flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full" style="background-color:${genre.color || '#ff0055'}"></span>
                            ${genre.name || genre.nombre || ''}
                        </span>
                    `;
                }
                const isGrid = displayMode.authors === 'grid';
                actions.innerHTML = `
                    <button onclick="toggleDisplayMode('authors')" title="Cambiar vista de lista/cuadros" 
                        class="ios-btn p-2 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 hover:text-white flex items-center gap-1 text-xs">
                        <i class="fa-solid ${isGrid ? 'fa-list' : 'fa-grip'} text-neonRed text-sm"></i>
                        <span class="hidden sm:inline">${isGrid ? 'Vista Lista' : 'Vista Cuadros'}</span>
                    </button>
                    <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700">
                        <i class="fa-solid fa-arrow-down-a-z text-xs text-slate-400"></i>
                        <select onchange="handleSortAuthors(this.value)" class="bg-transparent text-xs text-slate-200 focus:outline-none cursor-pointer">
                            <option value="name-asc" ${authorsSort === 'name-asc' ? 'selected' : ''}>Nombre (A-Z)</option>
                            <option value="name-desc" ${authorsSort === 'name-desc' ? 'selected' : ''}>Nombre (Z-A)</option>
                        </select>
                    </div>
                    <button onclick="openAuthorModal('${currentNavigation.genreId}')" class="ios-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 border border-slate-700 text-slate-200 hover:border-white flex items-center gap-2">
                        <i class="fa-solid fa-user-plus text-neonRed"></i>
                        <span>Agregar Autor</span>
                    </button>
                `;
            } else if (currentNavigation.view === 'books' && currentNavigation.genreId && currentNavigation.authorId) {
                const genre = libraryData.find(g => g.id === currentNavigation.genreId);
                const author = genre ? (genre.authors || genre.autores || []).find(a => a.id === currentNavigation.authorId) : null;
                const folder = (author && author.folders && currentNavigation.folderId) ? author.folders.find(f => f.id === currentNavigation.folderId) : null;
                
                if (genre && author) {
                    bcHtml += `
                        <i class="fa-solid fa-chevron-right text-xs text-slate-600"></i>
                        <button onclick="navigateTo('authors', '${genre.id}')" class="text-slate-400 hover:text-white">
                            ${genre.name || genre.nombre}
                        </button>
                        <i class="fa-solid fa-chevron-right text-xs text-slate-600"></i>
                        <button onclick="navigateTo('books', '${genre.id}', '${author.id}')" class="font-bold text-white hover:underline">
                            ${author.name || author.nombre}
                        </button>
                    `;
                    if (folder) {
                        bcHtml += `
                            <i class="fa-solid fa-chevron-right text-xs text-slate-600"></i>
                            <span class="font-bold flex items-center gap-1.5" style="color:${folder.color || '#00ff88'}">
                                <i class="fa-solid fa-folder"></i> ${folder.name}
                            </span>
                        `;
                    }
                }
                const isGrid = displayMode.books === 'grid';
                actions.innerHTML = `
                    <button onclick="toggleDisplayMode('books')" title="Cambiar vista de lista/cuadros" 
                        class="ios-btn p-2 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 hover:text-white flex items-center gap-1 text-xs">
                        <i class="fa-solid ${isGrid ? 'fa-list' : 'fa-grip'} text-neonRed text-sm"></i>
                        <span class="hidden sm:inline">${isGrid ? 'Vista Lista' : 'Vista Cuadros'}</span>
                    </button>
                    <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700">
                        <i class="fa-solid fa-sort text-xs text-slate-400"></i>
                        <select onchange="handleSortBooks(this.value)" class="bg-transparent text-xs text-slate-200 focus:outline-none cursor-pointer">
                            <option value="year-desc" ${booksSort === 'year-desc' ? 'selected' : ''}>Año (Más Reciente)</option>
                            <option value="year-asc" ${booksSort === 'year-asc' ? 'selected' : ''}>Año (Más Antiguo)</option>
                            <option value="title-asc" ${booksSort === 'title-asc' ? 'selected' : ''}>Título (A-Z)</option>
                            <option value="title-desc" ${booksSort === 'title-desc' ? 'selected' : ''}>Título (Z-A)</option>
                        </select>
                    </div>
                    <button onclick="openFolderModal('${currentNavigation.genreId}', '${currentNavigation.authorId}')" class="ios-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 border border-slate-700 text-emerald-400 hover:border-emerald-500 flex items-center gap-1.5">
                        <i class="fa-solid fa-folder-plus"></i>
                        <span>Nueva Carpeta</span>
                    </button>
                    <button onclick="openBookModal('${currentNavigation.genreId}', '${currentNavigation.authorId}')" class="ios-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 border border-slate-700 text-slate-200 hover:border-white flex items-center gap-2">
                        <i class="fa-solid fa-book-medical text-neonRed"></i>
                        <span>Agregar Libro</span>
                    </button>
                `;
            } else if (currentNavigation.view === 'favorites') {
                bcHtml += `
                    <i class="fa-solid fa-chevron-right text-xs text-slate-600"></i>
                    <span class="font-bold text-amber-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-heart"></i> Todos mis Audiolibros Favoritos
                    </span>
                `;
                actions.innerHTML = '';
            } else if (currentNavigation.view === 'search') {
                bcHtml = `
                    <span class="text-slate-400 flex items-center gap-2">
                        <i class="fa-solid fa-magnifying-glass text-neonRed"></i>
                        Buscando para: <strong class="text-white">"${document.getElementById('searchInput').value}"</strong>
                    </span>
                `;
                actions.innerHTML = '';
            } else {
                actions.innerHTML = `
                    <span class="text-xs text-slate-400 font-mono"><i class="fa-solid fa-grip-vertical mr-1"></i> Arrastra para reordenar</span>
                `;
            }

            bc.innerHTML = bcHtml;
        }

        // View 1: Genres
        function renderGenresView(container, emptyState) {
            if (libraryData.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            const list = document.createElement('div');
            list.className = 'flex flex-col gap-3';
            list.id = 'genresList';

            libraryData.forEach((genre, index) => {
                const authors = genre.authors || genre.autores || [];
                const totalAuthors = authors.length;
                const totalBooks = authors.reduce((acc, a) => acc + ((a.books || a.libros) ? (a.books || a.libros).length : 0), 0);
                const genreName = genre.name || genre.nombre || 'Sin nombre';
                const genreColor = genre.color || '#ff0055';

                const item = document.createElement('div');
                item.className = 'ios-glass-card p-4 md:p-5 flex items-center justify-between gap-4 cursor-pointer draggable-item';
                item.setAttribute('draggable', 'true');
                item.dataset.index = index;
                item.dataset.type = 'genre';
                item.style.setProperty('--genre-neon', genreColor);
                item.style.setProperty('--genre-glow', `${genreColor}40`);

                item.innerHTML = `
                    <div class="flex items-center gap-4 flex-grow min-w-0" onclick="navigateTo('authors', '${genre.id}')">
                        <div class="cursor-grab active:cursor-grabbing text-slate-600 hover:text-slate-300 p-1 drag-handle" onclick="event.stopPropagation()">
                            <i class="fa-solid fa-grip-vertical text-lg"></i>
                        </div>
                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 shadow-lg" 
                            style="background-color: ${genreColor}20; border: 1px solid ${genreColor}; box-shadow: 0 0 15px ${genreColor}40">
                            <i class="fa-solid fa-folder-open text-xl" style="color: ${genreColor}"></i>
                        </div>
                        <div class="truncate">
                            <h3 class="text-lg font-bold text-white group-hover:text-neonRed transition-colors truncate flex items-center gap-2">
                                ${genreName}
                            </h3>
                            <div class="flex items-center gap-3 text-xs text-slate-400 mt-1 font-mono">
                                <span><i class="fa-solid fa-user-pen mr-1"></i>${totalAuthors} Autores</span>
                                <span>•</span>
                                <span><i class="fa-solid fa-book mr-1"></i>${totalBooks} Libros</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 shrink-0">
                        <button onclick="event.stopPropagation(); openGenreModal('${genre.id}')" 
                            title="Editar Género"
                            class="ios-btn p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white flex items-center gap-1.5 text-xs font-semibold">
                            <i class="fa-solid fa-pen-to-square text-cyan-400"></i>
                            <span class="hidden sm:inline">Editar</span>
                        </button>
                        <button onclick="event.stopPropagation(); deleteGenre('${genre.id}')" 
                            title="Eliminar Género"
                            class="ios-btn p-2.5 rounded-xl bg-slate-800/80 hover:bg-rose-950/60 border border-slate-700 hover:border-rose-700 text-slate-300 hover:text-rose-400 flex items-center gap-1.5 text-xs font-semibold">
                            <i class="fa-solid fa-trash-can text-rose-500"></i>
                            <span class="hidden sm:inline">Eliminar</span>
                        </button>
                        <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400" onclick="navigateTo('authors', '${genre.id}')">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });

            container.appendChild(list);
            setupDragAndDrop(list, 'genre');
        }

        // View 2: Authors (Fotos Aún Más Grandes en Vista de Cuadros)
        function renderAuthorsView(container, emptyState) {

        // View 4: Buscador Optimizado
        function renderSearchResults(container, emptyState) {
            let authorMatches = [];
            let bookMatches = [];

            libraryData.forEach(genre => {
                const genreName = cleanString(genre.name || genre.nombre);
                const matchGenre = genreName.includes(searchQuery);
                const authors = genre.authors || genre.autores || [];

                authors.forEach(author => {
                    const authorName = cleanString(author.name || author.nombre);
                    const matchAuthorName = authorName.includes(searchQuery);

                    if (matchAuthorName) {
                        authorMatches.push({ genre, author });
                    }

                    const books = author.books || author.libros || [];
                    books.forEach(book => {
                        const bookTitle = cleanString(book.title || book.titulo);
                        const bookYear = cleanString(book.year || book.año);

        // Drag & Drop Handler
        function setupDragAndDrop(listElement, itemType) {
            let dragSrcEl = null;

            const items = listElement.querySelectorAll('.draggable-item');
            items.forEach(item => {
                item.addEventListener('dragstart', function(e) {
                    dragSrcEl = this;
                    this.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                item.addEventListener('dragover', function(e) {
                    if (e.preventDefault) e.preventDefault();
                    this.classList.add('drag-over');
                    return false;
                });

                item.addEventListener('dragleave', function() {
                    this.classList.remove('drag-over');
                });

                item.addEventListener('drop', function(e) {
                    if (e.stopPropagation) e.stopPropagation();
                    this.classList.remove('drag-over');

                    if (dragSrcEl !== this) {
                        const fromIndex = parseInt(dragSrcEl.dataset.index);
                        const toIndex = parseInt(this.dataset.index);

                        if (itemType === 'genre') {
                            const moved = libraryData.splice(fromIndex, 1)[0];
                            libraryData.splice(toIndex, 0, moved);
                        } else if (itemType === 'author') {
                            const genre = libraryData.find(g => g.id === currentNavigation.genreId);
                            if (genre) {
                                const arr = genre.authors || genre.autores;
                                const moved = arr.splice(fromIndex, 1)[0];
                                arr.splice(toIndex, 0, moved);
                            }
                        } else if (itemType === 'book') {
                            const genre = libraryData.find(g => g.id === currentNavigation.genreId);
                            const author = genre ? (genre.authors || genre.autores || []).find(a => a.id === currentNavigation.authorId) : null;
                            if (author) {
                                const arr = author.books || author.libros;
                                const moved = arr.splice(fromIndex, 1)[0];
                                arr.splice(toIndex, 0, moved);
                            }
                        }

                        saveLibraryData();
                        renderApp();
                    }
                    return false;
                });

                item.addEventListener('dragend', function() {
                    this.classList.remove('dragging');
                    items.forEach(i => i.classList.remove('drag-over'));
                });
            });
        }

                    year: year,
                    duration: duration,
                    status: status,
                    timeListened: timeListened,
                    favorite: false,
                    cover: cover,
                    isFisico: isFisico,
                    isAudio: isAudio,
                    audioUrl: audioUrl,
                    downloadUrl: downloadUrl
                };
                author.books.push(newBook);
            }

            saveLibraryData();
            closeModal('bookModal');
            renderApp();
        }

        function deleteBook(genreId, authorId, bookId) {
            if (confirm('¿Deseas eliminar este audiolibro?')) {
                const genre = libraryData.find(g => g.id === genreId);
                const author = genre ? (genre.authors || genre.autores || []).find(a => a.id === authorId) : null;
                if (author) {
                    const arr = author.books || author.libros || [];
                    author.books = arr.filter(b => b.id !== bookId);
                    saveLibraryData();
                    renderApp();
                }
            }
        }

        function toggleFavorite(genreId, authorId, bookId) {
            const genre = libraryData.find(g => g.id === genreId);
            const author = genre ? (genre.authors || genre.autores || []).find(a => a.id === authorId) : null;
            const book = author ? (author.books || author.libros || []).find(b => b.id === bookId) : null;
            if (book) {
                book.favorite = !book.favorite;
                saveLibraryData();
                renderApp();
            }
        }

        function openAuthorDetailModal(genreId, authorId) {
            const genre = libraryData.find(g => g.id === genreId);
            const author = genre ? (genre.authors || genre.autores || []).find(a => a.id === authorId) : null;
            if (!author) return;

            const books = author.books || author.libros || [];
            const authorName = author.name || author.nombre || 'Autor';
            const genreColor = genre.color || '#ff0055';
            const genreName = genre.name || genre.nombre || '';

            const content = document.getElementById('authorDetailContent');
            content.innerHTML = `
                <div class="flex flex-col sm:flex-row items-center sm:items-start gap-5">
                    <div class="w-28 h-40 rounded-2xl overflow-hidden bg-slate-950 shrink-0 border border-slate-700 shadow-2xl"
                        style="border-color: ${genreColor}; box-shadow: 0 0 15px ${genreColor}40">
                        ${author.photo ? `<img src="${author.photo}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center"><i class="fa-solid fa-user text-4xl" style="color:${genreColor}"></i></div>`}
                    </div>
                    <div>
                        <span class="neon-badge px-2.5 py-0.5 rounded-full text-[10px] font-mono uppercase" style="--genre-neon:${genreColor}; --genre-glow:${genreColor}40">${genreName}</span>
                        <h2 class="text-2xl font-extrabold text-white mt-1">${authorName}</h2>
                        <p class="text-slate-300 text-sm mt-3 leading-relaxed">${author.bio || 'Sin biografía registrada.'}</p>
                    </div>
                </div>

                <div class="mt-6 pt-5 border-t border-slate-800">
                    <h4 class="text-xs font-mono uppercase text-slate-400 mb-3">Audiolibros Publicados (${books.length})</h4>
                    <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
                        ${books.map(b => `
                            <div class="p-2.5 rounded-xl bg-slate-900/80 border border-slate-800 flex items-center justify-between gap-3">
                                <div class="flex items-center gap-2.5 min-w-0">
                                    <div class="w-10 h-14 rounded overflow-hidden bg-slate-950 shrink-0">
                                        ${b.cover ? `<img src="${b.cover}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-slate-700"><i class="fa-solid fa-book"></i></div>`}
                                    </div>
                                    <span class="text-sm font-semibold text-slate-200 truncate">${b.title || b.titulo}</span>
                                </div>
                                <span class="text-xs font-mono text-slate-400 shrink-0">${b.year || b.año || ''}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('authorDetailModal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function updateStats() {
            let totalGenres = libraryData.length;
            let totalAuthors = 0;
            let totalBooks = 0;
            let totalFavs = 0;

            libraryData.forEach(g => {
                const authors = g.authors || g.autores || [];
                totalAuthors += authors.length;
                authors.forEach(a => {
                    const books = a.books || a.libros || [];
                    totalBooks += books.length;
                    totalFavs += books.filter(b => b.favorite).length;
                });
            });

            document.getElementById('statGenresCount').innerText = totalGenres;
            document.getElementById('statAuthorsCount').innerText = totalAuthors;
            document.getElementById('statBooksCount').innerText = totalBooks;
            document.getElementById('statFavsCount').innerText = totalFavs;
        }

        function initBackgroundCanvas() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 2 + 1,
                    color: Math.random() > 0.5 ? '#ff0055' : '#00f3ff',
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    alpha: Math.random() * 0.4 + 0.1
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
